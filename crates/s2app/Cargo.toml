[package]
name = "s2app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenSuper2 desktop frontend (window, input, presentation)"

[[bin]]
name = "opensuper2"
path = "src/main.rs"

[dependencies]
s2engine.workspace = true
s2data.workspace = true
anyhow.workspace = true
clap.workspace = true
winit.workspace = true
softbuffer.workspace = true
cpal = "0.15"
rustysynth = "1.3"
wgpu = { version = "30", default-features = false, features = ["std", "parking_lot", "dx12", "vulkan", "gles", "wgsl"] }
pollster = "0.4"
encoding_rs.workspace = true
png.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_Media_Audio", "Win32_UI_WindowsAndMessaging"] }
